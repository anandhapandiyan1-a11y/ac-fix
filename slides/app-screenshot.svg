<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="AC-Fix app screenshot">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10b981"/><stop offset="1" stop-color="#059669"/></gradient></linearGradient>
  </defs>
  <!-- Phone frame -->
  <rect x="160" y="10" width="580" height="430" rx="40" fill="#1e293b" stroke="none"/>
  <rect x="168" y="18" width="564" height="414" rx="34" fill="url(#bgGrad)" stroke="none"/>
  <!-- Browser chrome / status bar -->
  <rect x="200" y="50" width="520" height="30" rx="8" fill="#f1f5f9" stroke="none"/>
  <circle cx="218" cy="65" r="4" fill="#ef4444"/>
  <circle cx="234" cy="65" r="4" fill="#f59e0b"/>
  <circle cx="250" cy="65" r="4" fill="#10b981"/>
  <text x="508" y="74" text-anchor="middle" font-family="system-ui" font-size="16" fill="#64748b">AC-Fix</text>
  <!-- Navbar -->
  <rect x="200" y="98" width="520" height="56" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="226" cy="126" r="14" fill="url(#g1)" font-weight="700"/>
  <text x="254" y="132" font-family="system-ui" font-weight="700" font-size="15" fill="#0f172a">AC-Fix</text>
  <text x="254" y="150" font-family="system-ui" font-size="11" fill="#94a3b8">LOCAL SERVICE FINDER</text>
  <text x="516" y="132" font-family="system-ui" font-weight="600" font-size="13" fill="#0ea5e9" text-anchor="middle">Find Mechanic</text>
  <text x="600" y="132" font-family="system-ui" font-size="13" fill="#64748b">My Bookings</text>
  <!-- Split: Map + list -->
  <rect x="200" y="172" width="310" height="280" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
